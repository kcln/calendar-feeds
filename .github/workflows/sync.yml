name: Sync Canvas calendar

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Canvas feed and transform
        env:
          CANVAS_URL: ${{ secrets.CANVAS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CANVAS_URL:-}" ]; then
            echo "CANVAS_URL secret is not set" >&2
            exit 1
          fi
          tmp="$(mktemp)"
          curl -fsSL --retry 3 --retry-delay 5 "$CANVAS_URL" -o "$tmp"
          # Per-VEVENT transforms:
          #   - drop blocks tagged accy_503
          #   - true all-day events (DTSTART;VALUE=DATE:) OR zero-duration deadline
          #     markers (DTSTART == DTEND, used by Canvas for assignment due dates)
          #     get TRANSP:TRANSPARENT so they do not block time.
          # CLASS left as-is (Canvas sets PUBLIC) so the calendar owner can see
          # event details. Show-as-busy to other viewers is controlled by Google
          # Calendar's share setting ("See only free/busy"), not the ICS file.
          awk '
            BEGIN { in_event=0; buf=""; dtstart=""; dtend=""; allday=0 }
            /^BEGIN:VEVENT/ { in_event=1; buf=$0 ORS; dtstart=""; dtend=""; allday=0; next }
            in_event && /^DTSTART/ {
              if ($0 ~ /^DTSTART;VALUE=DATE:/) allday=1
              p = index($0, ":")
              if (p > 0) { v = substr($0, p+1); sub(/\r$/, "", v); dtstart = v }
              buf = buf $0 ORS; next
            }
            in_event && /^DTEND/ {
              p = index($0, ":")
              if (p > 0) { v = substr($0, p+1); sub(/\r$/, "", v); dtend = v }
              buf = buf $0 ORS; next
            }
            in_event && /^END:VEVENT/ {
              buf = buf $0 ORS
              if (buf ~ /accy_503/) { in_event=0; buf=""; next }
              zero_dur = (dtstart != "" && dtstart == dtend)
              if (allday || zero_dur) {
                if (buf ~ /TRANSP:OPAQUE/) {
                  gsub(/TRANSP:OPAQUE/, "TRANSP:TRANSPARENT", buf)
                } else if (buf !~ /TRANSP:/) {
                  sub(/END:VEVENT/, "TRANSP:TRANSPARENT\r\nEND:VEVENT", buf)
                }
              }
              printf "%s", buf
              in_event=0; buf=""; next
            }
            in_event { buf = buf $0 ORS; next }
            { print }
          ' "$tmp" > "feed-df083ef153e1287ee3d0e89eeea8b92c.ics"
          rm -f "$tmp"

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "feed-df083ef153e1287ee3d0e89eeea8b92c.ics"
          if git diff --cached --quiet -- "feed-df083ef153e1287ee3d0e89eeea8b92c.ics"; then
            echo "No changes."
            exit 0
          fi
          git commit -m "sync: refresh calendar feed"
          git push
