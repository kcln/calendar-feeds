name: Sync Canvas calendar

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Canvas feed and rewrite CLASS
        env:
          CANVAS_URL: ${{ secrets.CANVAS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CANVAS_URL:-}" ]; then
            echo "CANVAS_URL secret is not set" >&2
            exit 1
          fi
          tmp="$(mktemp)"
          curl -fsSL --retry 3 --retry-delay 5 "$CANVAS_URL" -o "$tmp"
          sed 's/CLASS:PUBLIC/CLASS:PRIVATE/g' "$tmp" > "feed-df083ef153e1287ee3d0e89eeea8b92c.ics"
          rm -f "$tmp"

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "feed-df083ef153e1287ee3d0e89eeea8b92c.ics"
          if git diff --cached --quiet -- "feed-df083ef153e1287ee3d0e89eeea8b92c.ics"; then
            echo "No changes."
            exit 0
          fi
          git commit -m "sync: refresh calendar feed"
          git push
