name: Sync Canvas calendar

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Canvas feed and transform
        env:
          CANVAS_URL: ${{ secrets.CANVAS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CANVAS_URL:-}" ]; then
            echo "CANVAS_URL secret is not set" >&2
            exit 1
          fi
          tmp="$(mktemp)"
          curl -fsSL --retry 3 --retry-delay 5 "$CANVAS_URL" -o "$tmp"
          # Per-VEVENT transforms:
          #   - drop blocks tagged accy_503
          #   - all-day events: force TRANSP:TRANSPARENT (so they do not block time)
          # CLASS is left as-is (Canvas sets PUBLIC). Privacy to other viewers is
          # controlled by Google Calendar's share-as-busy setting, not the ICS file.
          awk '
            /^BEGIN:VEVENT/ { in_event=1; buf=$0 ORS; next }
            in_event && /^END:VEVENT/ {
              buf = buf $0 ORS
              if (buf ~ /accy_503/) { in_event=0; buf=""; next }
              if (buf ~ /DTSTART;VALUE=DATE:/) {
                if (buf ~ /TRANSP:OPAQUE/) {
                  gsub(/TRANSP:OPAQUE/, "TRANSP:TRANSPARENT", buf)
                } else if (buf !~ /TRANSP:/) {
                  sub(/END:VEVENT/, "TRANSP:TRANSPARENT\r\nEND:VEVENT", buf)
                }
              }
              printf "%s", buf
              in_event=0; buf=""; next
            }
            in_event { buf = buf $0 ORS; next }
            { print }
          ' "$tmp" > "feed-df083ef153e1287ee3d0e89eeea8b92c.ics"
          rm -f "$tmp"

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "feed-df083ef153e1287ee3d0e89eeea8b92c.ics"
          if git diff --cached --quiet -- "feed-df083ef153e1287ee3d0e89eeea8b92c.ics"; then
            echo "No changes."
            exit 0
          fi
          git commit -m "sync: refresh calendar feed"
          git push
